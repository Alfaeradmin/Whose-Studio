<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thiết lập mật khẩu | Whose Studio</title><link rel="stylesheet" href="/app.css"><style>.auth-panel{gap:13px}.auth-panel form{display:flex;flex-direction:column;gap:8px}.auth-panel form[hidden]{display:none!important}.auth-panel input{font-size:16px;min-height:50px;border:1px solid #d5d1c9;border-radius:12px;padding:10px 13px}.auth-panel form button{min-height:50px;border:0;border-radius:13px;background:#20251f;color:#fff;font-weight:750}.auth-panel form button:disabled{opacity:.6}.auth-back{color:#4e7254;text-decoration:none;font-size:14px;font-weight:700}.auth-caption{line-height:1.6}.auth-screen{height:auto;min-height:100dvh}.auth-panel{min-height:100dvh;justify-content:center}.auth-side-title{max-width:430px}</style></head><body><div class="auth-screen"><main class="auth-panel"><div class="auth-symbol">W</div><div class="auth-eyebrow">WHOSE STUDIO · ADMIN</div><h1 id="resetTitle">Thiết lập mật khẩu</h1><p id="resetInfo">Dành cho quản trị viên Whose Studio.</p><form id="requestForm"><label for="resetEmail">Email quản trị viên</label><input id="resetEmail" type="email" required value="alfaeradmin@gmail.com" autocomplete="email"><button type="submit" id="requestBtn">Gửi email đặt mật khẩu</button></form><form id="completeForm" hidden><label for="newPassword">Mật khẩu mới (ít nhất 12 ký tự)</label><input id="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="confirmPassword">Nhập lại mật khẩu</label><input id="confirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button id="completeBtn" type="submit">Lưu mật khẩu mới</button></form><div id="resetNotice" role="status" aria-live="polite"></div><div id="resetError" role="alert"></div><a class="auth-back" href="/">← Quay lại đăng nhập</a><p class="auth-caption">Chỉ dùng liên kết đặt mật khẩu nhận từ email. Không chia sẻ liên kết hoặc mật khẩu.</p></main><aside class="auth-side"><div class="auth-side-label">WHOSE STUDIO</div><div class="auth-side-title">Secure from the start.</div></aside></div><script src="/reset-password.js" defer></script></body></html>
