<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thiết lập mật khẩu | Whose Studio</title><link rel="stylesheet" href="/app.css"></head><body><main class="auth-panel"><h1>Thiết lập mật khẩu</h1><p id="resetInfo">Dành cho quản trị viên Whose Studio.</p><form id="requestForm"><label for="resetEmail">Email quản trị viên</label><input id="resetEmail" type="email" required value="alfaeradmin@gmail.com" autocomplete="email"><button type="submit" id="requestBtn">Gửi email đặt mật khẩu</button></form><form id="completeForm" hidden><label for="newPassword">Mật khẩu mới (ít nhất 12 ký tự)</label><input id="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="confirmPassword">Nhập lại mật khẩu</label><input id="confirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button id="completeBtn" type="submit">Lưu mật khẩu mới</button></form><div id="resetNotice" role="status" aria-live="polite"></div><div id="resetError" role="alert"></div></main><script src="/reset-password.js" defer></script></body></html>
