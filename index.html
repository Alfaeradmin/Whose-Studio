<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whose Studio — KiotViet Audit</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#101828;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1240px;margin:auto;padding:28px 18px 60px}.hero{background:#111827;color:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 55px #11182718}.eyebrow{opacity:.65;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:700}.hero h1{font-size:32px;margin:7px 0 8px}.hero p{margin:0;color:#cbd5e1}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.pill{padding:8px 11px;border-radius:999px;background:#ffffff14;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.card{background:#fff;border:1px solid #e7e9ee;border-radius:18px;padding:18px;box-shadow:0 3px 14px #10182808}.card h3{margin:0 0 8px;font-size:13px;color:#667085}.big{font-size:28px;font-weight:750}.section{margin-top:24px}.section h2{font-size:18px;margin:0 0 10px}.status{display:flex;align-items:center;gap:8px;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#98a2b3}.ok .dot{background:#12b76a}.bad .dot{background:#f04438}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eef0f4;vertical-align:top}th{color:#667085;font-weight:650}.muted{color:#98a2b3}.error{color:#b42318;font-size:12px;word-break:break-word}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.btn{border:0;background:#111827;color:#fff;border-radius:12px;padding:10px 14px;font-weight:650;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.wide{grid-column:span 3}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.hero h1{font-size:26px}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div class="eyebrow">Isolated read-only audit</div><h1>Whose Studio</h1><p>Tổng quan KiotViet — không ghi dữ liệu, không kết nối ALFAER WMS.</p><div class="bar"><span class="pill">Retailer: <b id="retailer">—</b></span><span class="pill">Mode: GET only</span><span class="pill" id="updated">Chưa tải</span></div></div>
<div class="section"><div class="toolbar"><h2>Tổng quan</h2><button class="btn" id="reload">Làm mới dữ liệu</button></div><div class="grid" id="totals"></div></div>
<div class="section"><h2>Kết nối API</h2><div class="card" id="connectivity">Đang tải…</div></div>
<div class="section"><h2>Chi nhánh</h2><div class="card" id="branches">Đang tải…</div></div>
<div class="section"><h2>Inventory snapshot (100 SKU đầu tiên)</h2><div class="grid" id="inventory"></div></div>
<div class="section"><h2>Mẫu giao dịch gần đây</h2><div class="card" id="samples">Đang tải…</div></div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const fmt=n=>n==null?'—':new Intl.NumberFormat('vi-VN').format(n);
async function load(){
const b=document.getElementById('reload');b.disabled=true;b.textContent='Đang đọc KiotViet…';
try{
const r=await fetch('/api/overview',{cache:'no-store'});const d=await r.json();
document.getElementById('retailer').textContent=d.retailer||'—';
document.getElementById('updated').textContent=new Date(d.generatedAt).toLocaleString('vi-VN');
document.getElementById('totals').innerHTML=Object.entries(d.totals||{}).map(([k,v])=>'<div class="card"><h3>'+esc(k)+'</h3><div class="big">'+fmt(v)+'</div></div>').join('');
document.getElementById('connectivity').innerHTML=Object.entries(d.connectivity||{}).map(([k,v])=>'<div class="status '+(v.ok?'ok':'bad')+'"><i class="dot"></i><b>'+esc(k)+'</b><span class="muted">'+fmt(v.ms)+' ms</span>'+(v.error?'<span class="error">'+esc(v.error)+'</span>':'')+'</div>').join('<br>');
document.getElementById('branches').innerHTML='<table><thead><tr><th>ID</th><th>Tên</th><th>Địa chỉ</th><th>Trạng thái</th></tr></thead><tbody>'+(d.branches||[]).map(x=>'<tr><td>'+esc(x.id)+'</td><td>'+esc(x.branchName||x.name)+'</td><td>'+esc(x.address||'')+'</td><td>'+(x.isActive===false?'Ngừng':'Hoạt động')+'</td></tr>').join('')+'</tbody></table>';
const inv=d.inventory||{};
document.getElementById('inventory').innerHTML=[['Inventory rows',inv.inventoryRows],['Âm tồn',inv.negative],['Tồn = 0',inv.zero],['Tồn dương',inv.positive]].map(([k,v])=>'<div class="card"><h3>'+k+'</h3><div class="big">'+fmt(v)+'</div></div>').join('')+'<div class="card wide"><table><thead><tr><th>Chi nhánh</th><th>Dòng SKU</th><th>Tổng onHand trong mẫu</th></tr></thead><tbody>'+(inv.byBranch||[]).map(x=>'<tr><td>'+esc(x.branchName||x.branchId)+'</td><td>'+fmt(x.skuRows)+'</td><td>'+fmt(x.onHand)+'</td></tr>').join('')+'</tbody></table></div>';
const samples=d.samples||{};
document.getElementById('samples').innerHTML=Object.entries(samples).map(([kind,rows])=>'<h3>'+esc(kind)+'</h3><table><thead><tr><th>Code</th><th>Tên/đối tác</th><th>Chi nhánh</th><th>Ngày</th><th>Total</th><th>Status</th></tr></thead><tbody>'+(rows||[]).map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.branchName||x.branchId)+'</td><td>'+esc(x.purchaseDate)+'</td><td>'+fmt(x.total)+'</td><td>'+esc(x.status)+'</td></tr>').join('')+'</tbody></table>').join('');
}catch(e){document.getElementById('connectivity').innerHTML='<span class="error">'+esc(e.message)+'</span>'}
finally{b.disabled=false;b.textContent='Làm mới dữ liệu'}
}
document.getElementById('reload').onclick=load;load();
</script></body></html>
