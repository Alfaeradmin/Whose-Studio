<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whose Studio</title>
<meta name="description" content="Whose Studio workspace">
<meta name="theme-color" content="#f7f8fa">
<link rel="stylesheet" href="/ui-auth-minimal.css?v=20261014">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input{font:inherit}
[hidden]{display:none!important}
.auth-screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-panel{width:min(388px,100%);margin:auto}
.auth-symbol{display:grid;place-items:center}
#loginForm{display:flex;flex-direction:column}
#loginForm input{width:100%}
.auth-recovery-link{display:block}
.workspace-blank{min-height:100dvh;background:#f8f9fb}
.workspace-topbar{height:66px;border-bottom:1px solid #e7eaf0;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,4vw,55px);background:#fff}
.workspace-brand{font-size:15px;font-weight:750;letter-spacing:.04em;color:#1c2736}
.workspace-logout{background:#fff;border:1px solid #dfe4eb;border-radius:9px;padding:9px 14px;color:#465469;cursor:pointer}
.workspace-logout:hover{background:#f5f7f9}
.workspace-canvas{min-height:calc(100dvh - 66px)}
</style>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-panel">
    <div class="auth-symbol">W</div>
    <div class="auth-eyebrow">WHOSE STUDIO</div>
    <h1>Đăng nhập Whose Studio</h1>
    <p class="auth-lede">Đăng nhập để tiếp tục công việc.</p>
    <form id="loginForm" autocomplete="on">
      <label for="loginEmail">Email công việc</label>
      <input id="loginEmail" type="email" inputmode="email" autocomplete="username" placeholder="ten@whose.vn" required maxlength="254">
      <label for="loginPassword">Mật khẩu</label>
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required minlength="8">
      <p class="auth-error" id="loginError" role="alert" aria-live="polite"></p>
      <button class="auth-submit" id="loginSubmit" type="submit">Đăng nhập</button>
    </form>
    <a class="auth-recovery-link" href="/reset-password.html">Thiết lập mật khẩu lần đầu / Quên mật khẩu?</a>
    <div class="auth-caption">Dành cho nhân viên Whose Studio</div>
  </div>
</div>
<div class="workspace-blank" id="appRoot" hidden>
  <header class="workspace-topbar">
    <div class="workspace-brand">WHOSE STUDIO</div>
    <button class="workspace-logout" type="button" id="logoutBtn">Đăng xuất</button>
  </header>
  <main class="workspace-canvas" aria-label="Workspace trống"></main>
</div>
<script src="/auth-shell.js?v=20261014" defer></script>
</body>
</html>
